<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--bg2:#0f0f0f;--bg3:#1a1a1a;--bg4:#222;
  --accent:#00ffcc;--accent2:rgba(0,255,204,0.12);
  --text:#fff;--text2:#aaa;--text3:#555;
  --red:#ff4466;--yellow:#ffcc00;--border:#1e1e1e;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Syne',sans-serif;color:var(--text);}
input,textarea,button{font-family:'Syne',sans-serif;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1),opacity 0.3s;}
.screen.off{transform:translateX(100%);opacity:0;pointer-events:none;}
.screen.left{transform:translateX(-30%);opacity:0;pointer-events:none;}
#join-screen{align-items:center;justify-content:center;padding:30px;}
.join-logo{font-size:52px;margin-bottom:8px;}
.join-title{font-size:36px;font-weight:800;letter-spacing:-1px;color:var(--accent);}
.join-sub{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:36px;letter-spacing:1px;}
.join-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:16px 20px;color:var(--text);font-size:16px;outline:none;margin-bottom:12px;transition:border-color 0.2s;}
.join-input:focus{border-color:var(--accent);}
.join-input::placeholder{color:var(--text3);}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:20px;width:100%;}
.avatar-opt{width:100%;aspect-ratio:1;border-radius:12px;background:var(--bg3);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all 0.15s;}
.avatar-opt.selected{border-color:var(--accent);background:var(--accent2);}
.color-grid{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;}
.color-opt.selected{border-color:#fff;transform:scale(1.15);}
.join-btn{width:100%;padding:16px;background:var(--accent);color:#000;font-size:16px;font-weight:800;border:none;border-radius:14px;cursor:pointer;letter-spacing:0.5px;transition:transform 0.15s;}
.join-btn:active{transform:scale(0.97);}
.join-note{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:12px;text-align:center;}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;flex-shrink:0;}
.status-time{font-size:13px;font-weight:600;}
.enc-pill{background:var(--accent2);border:1px solid var(--accent);color:var(--accent);font-size:9px;padding:2px 7px;border-radius:20px;font-family:'DM Mono',monospace;}
.bottom-nav{display:flex;background:var(--bg);border-top:0.5px solid var(--border);padding:8px 0 20px;flex-shrink:0;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;padding:4px;font-family:'Syne',sans-serif;transition:color 0.2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:22px;height:22px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 10px;flex-shrink:0;}
.header-title{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
.header-sub{font-size:10px;color:var(--accent);font-family:'DM Mono',monospace;}
.hbtn{width:36px;height:36px;border-radius:50%;background:var(--bg3);border:0.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.stories-wrap{padding:4px 16px 12px;flex-shrink:0;}
.stories-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.stories-row::-webkit-scrollbar{display:none;}
.story-item{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2.5px;background:linear-gradient(135deg,var(--accent),#0088ff);}
.story-ring.mine{background:linear-gradient(135deg,#ff00cc,var(--accent));}
.story-ring.seen{background:var(--bg4);}
.story-inner{width:100%;height:100%;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-size:20px;}
.story-name{font-size:9px;color:var(--text2);font-family:'DM Mono',monospace;max-width:58px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.add-story-btn{width:56px;height:56px;border-radius:50%;background:var(--bg3);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text3);cursor:pointer;}
.chat-list{flex:1;overflow-y:auto;scrollbar-width:none;}
.chat-list::-webkit-scrollbar{display:none;}
.chat-row{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background 0.15s;}
.chat-row:hover,.chat-row:active{background:var(--bg2);}
.user-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;position:relative;}
.online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);}
.chat-info{flex:1;min-width:0;}
.chat-name{font-size:14px;font-weight:600;margin-bottom:2px;}
.chat-last{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.chat-time{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;}
